  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

e=\"position:relative; overflow:hidden; padding:120px 48px 100px; display:flex; flex-direction:column; align-items:flex-start; gap:28px; min-height:88vh;\">\n    <div style=\"position:absolute; width:520px; height:520px; border-radius:50%; background:radial-gradient(circle, var(--accent) 0%, transparent 70%); opacity:0.18; filter:blur(40px); top:-160px; right:-120px; animation:cga-drift-a 14s ease-in-out infinite; pointer-events:none;\"><\u002Fdiv>\n    <div style=\"position:absolute; width:420px; height:420px; border-radius:50%; background:radial-gradient(circle, var(--accent2) 0%, transparent 70%); opacity:0.14; filter:blur(40px); bottom:-140px; left:-80px; animation:cga-drift-b 16s ease-in-out infinite; pointer-events:none;\"><\u002Fdiv>\n    <div style=\"position:absolute; inset:0; background-image:repeating-linear-gradient(0deg, var(--line) 0px, transparent 1px, transparent 64px), repeating-linear-gradient(90deg, var(--line) 0px, transparent 1px, transparent 64px); opacity:0.35; pointer-events:none;\"><\u002Fdiv>\n\n    <div style=\"position:relative; display:flex; align-items:center; gap:8px; font-family:var(--font-mono); font-size:12px; letter-spacing:0.08em; color:var(--accent); border:1px solid var(--line); padding:8px 14px; border-radius:100px; background:var(--bg2);\">\n      <span style=\"width:6px; height:6px; border-radius:50%; background:var(--accent); display:inline-block;\"><\u002Fspan>\n      CG ADVISORS — WASHINGTON, DC\n    <\u002Fdiv>\n\n    <h1 style=\"position:relative; font-family:var(--font-display); font-weight:600; font-size:clamp(2.6rem, 5.6vw, 5.2rem); line-height:1.02; letter-spacing:-0.02em; max-width:16ch;\">\n      Strategy, product, and <span style=\"color:var(--accent);\">agentic systems<\u002Fspan> — built to ship.\n    <\u002Fh1>\n\n    <p style=\"position:relative; font-size:clamp(1.05rem, 1.4vw, 1.3rem); color:var(--muted); max-width:640px; line-height:1.55;\">{{ heroSubhead }}<\u002Fp>\n\n    <div style=\"position:relative; display:flex; gap:16px; flex-wrap:wrap; margin-top:8px;\">\n      <a href=\"#contact\" style=\"font-size:15px; font-weight:600; background:var(--accent); color:var(--accent-ink); padding:15px 28px; border-radius:100px;\" style-hover=\"filter:brightness(1.08); transform:translateY(-1px);\">Book a strategy call<\u002Fa>\n      <a href=\"#work\" style=\"font-size:15px; font-weight:600; border:1px solid var(--line); color:var(--fg); padding:15px 28px; border-radius:100px;\" style-hover=\"border-color:var(--accent); color:var(--accent);\">See our work<\u002Fa>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ showTicker }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"position:relative; display:flex; align-items:center; gap:10px; margin-top:12px; font-family:var(--font-mono); font-size:13px; color:var(--muted);\">\n        <span style=\"width:6px; height:6px; border-radius:50%; background:var(--accent2); display:inline-block; flex:none;\"><\u002Fspan>\n        {{ tickerText }}\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fsection>\n\n  <section id=\"services\" data-screen-label=\"Services\" style=\"background:var(--bg2); padding:110px 48px; display:flex; flex-direction:column; gap:56px;\">\n    <div style=\"display:flex; flex-direction:column; gap:16px; max-width:640px;\">\n      <span style=\"font-family:var(--font-mono); font-size:12px; letter-spacing:0.1em; color:var(--accent);\">WHAT WE DO<\u002Fspan>\n      <h2 style=\"font-family:var(--font-display); font-weight:600; font-size:clamp(1.8rem, 3vw, 2.6rem); letter-spacing:-0.01em;\">Three ways we move you forward.<\u002Fh2>\n    <\u002Fdiv>\n\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:28px;\">\n\n      <div style=\"background:var(--bg); border:1px solid var(--line); border-radius:18px; padding:36px; display:flex; flex-direction:column; gap:18px;\" style-hover=\"border-color:var(--accent);\">\n        <span style=\"font-family:var(--font-mono); font-size:13px; color:var(--accent);\">01<\u002Fspan>\n        <h3 style=\"font-family:var(--font-display); font-weight:600; font-size:1.35rem;\">Strategy &amp; Transformation<\u002Fh3>\n        <p style=\"color:var(--muted); font-size:15px; line-height:1.55;\">You have big ideas. We turn them into an operating plan — and the metrics to prove it's working.<\u002Fp>\n        <ul style=\"list-style:none; display:flex; flex-direction:column; gap:10px; font-size:14px; color:var(--fg);\">\n          <li style=\"display:flex; gap:8px;\"><span style=\"color:var(--accent);\">—<\u002Fspan> Business transformation roadmaps<\u002Fli>\n          <li style=\"display:flex; gap:8px;\"><span style=\"color:var(--accent);\">—<\u002Fspan> Process redesign against strategic objectives<\u002Fli>\n          <li style=\"display:flex; gap:8px;\"><span style=\"color:var(--accent);\">—<\u002Fspan> KPI design, OKRs &amp; real-time dashboards<\u002Fli>\n        <\u002Ful>\n        <div style=\"display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;\">\n          <span style=\"font-family:var(--font-mono); font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:100px; padding:5px 10px;\">OKRs<\u002Fspan>\n          <span style=\"font-family:var(--font-mono); font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:100px; padding:5px 10px;\">SLAs<\u002Fspan>\n          <span style=\"font-family:var(--font-mono); font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:100px; padding:5px 10px;\">PMBOK<\u002Fspan>\n          <span style=\"font-family:var(--font-mono); font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:100px; padding:5px 10px;\">ISO<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:var(--bg); border:1px solid var(--line); border-radius:18px; padding:36px; display:flex; flex-direction:column; gap:18px;\" style-hover=\"border-color:var(--accent);\">\n        <span style=\"font-family:var(--font-mono); font-size:13px; color:var(--accent);\">02<\u002Fspan>\n        <h3 style=\"font-family:var(--font-display); font-weight:600; font-size:1.35rem;\">Product &amp; Growth<\u002Fh3>\n        <p style=\"color:var(--muted); font-size:15px; line-height:1.55;\">We evolve product ideas into real product-market fit — validated by customers, not assumptions.<\u002Fp>\n        <ul style=\"list-style:none; display:flex; flex-direction:column; gap:10px; font-size:14px; color:var(--fg);\">\n          <li style=\"display:flex; gap:8px;\"><span style=\"color:var(--accent);\">—<\u002Fspan> Lean product development &amp; customer validation<\u002Fli>\n          <li style=\"display:flex; gap:8px;\"><span style=\"color:var(--accent);\">—<\u002Fspan> Marketing operations &amp; digital advertising<\u002Fli>\n          <li style=\"display:flex; gap:8px;\"><span style=\"color:var(--accent);\">—<\u002Fspan> Go-to-market &amp; business development<\u002Fli>\n        <\u002Ful>\n        <div style=\"display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;\">\n          <span style=\"font-family:var(--font-mono); font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:100px; padding:5px 10px;\">Lean Startup<\u002Fspan>\n          <span style=\"font-family:var(--font-mono); font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:100px; padding:5px 10px;\">GTM<\u002Fspan>\n          <span style=\"font-family:var(--font-mono); font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:100px; padding:5px 10px;\">UX Design<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:var(--bg); border:1px solid var(--line); border-radius:18px; padding:36px; display:flex; flex-direction:column; gap:18px;\" style-hover=\"border-color:var(--accent);\">\n        <span style=\"font-family:var(--font-mono); font-size:13px; color:var(--accent);\">03<\u002Fspan>\n        <h3 style=\"font-family:var(--font-display); font-weight:600; font-size:1.35rem;\">Technology &amp; Autonomous Systems<\u002Fh3>\n        <p style=\"color:var(--muted); font-size:15px; line-height:1.55;\">{{ techDesc }}<\u002Fp>\n        <ul style=\"list-style:none; display:flex; flex-direction:column; gap:10px; font-size:14px; color:var(--fg);\">\n          <li style=\"display:flex; gap:8px;\"><span style=\"color:var(--accent);\">—<\u002Fspan> Web, mobile &amp; dashboard applications<\u002Fli>\n          <li style=\"display:flex; gap:8px;\"><span style=\"color:var(--accent);\">—<\u002Fspan> {{ techBullet }}<\u002Fli>\n          <li style=\"display:flex; gap:8px;\"><span style=\"color:var(--accent);\">—<\u002Fspan> Deployed on AWS, Azure &amp; Google Cloud<\u002Fli>\n        <\u002Ful>\n        <div style=\"display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;\">\n          <span style=\"font-family:var(--font-mono); font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:100px; padding:5px 10px;\">Node<\u002Fspan>\n          <span style=\"font-family:var(--font-mono); font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:100px; padding:5px 10px;\">Python<\u002Fspan>\n          <span style=\"font-family:var(--font-mono); font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:100px; padding:5px 10px;\">TensorFlow<\u002Fspan>\n          <span style=\"font-family:var(--font-mono); font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:100px; padding:5px 10px;\">Agile<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"work\" data-screen-label=\"Case Studies\" style=\"background:var(--bg); padding:110px 48px; display:flex; flex-direction:column; gap:48px;\">\n    <div style=\"display:flex; flex-direction:column; gap:16px; max-width:640px;\">\n      <span style=\"font-family:var(--font-mono); font-size:12px; letter-spacing:0.1em; color:var(--accent);\">SELECTED WORK<\u002Fspan>\n      <h2 style=\"font-family:var(--font-display); font-weight:600; font-size:clamp(1.8rem, 3vw, 2.6rem); letter-spacing:-0.01em;\">Proof, not promises.<\u002Fh2>\n    <\u002Fdiv>\n\n    <div style=\"display:grid; grid-template-columns:minmax(260px,1fr) minmax(320px,1.4fr); gap:0; border:1px solid var(--line); border-radius:20px; overflow:hidden;\">\n      <div style=\"position:relative; background:var(--bg2); padding:40px; display:flex; align-items:center; justify-content:center; min-height:280px;\">\n        <div style=\"position:absolute; inset:0; background-image:repeating-linear-gradient(45deg, var(--line) 0, transparent 1px, transparent 18px); opacity:0.5;\"><\u002Fdiv>\n        <div style=\"position:relative; display:flex; flex-direction:column; gap:14px; align-items:center;\">\n          <div style=\"width:96px; height:96px; border-radius:50%; border:1px solid var(--accent); opacity:0.5;\"><\u002Fdiv>\n          <div style=\"width:64px; height:64px; border-radius:50%; border:1px solid var(--accent2); margin-top:-70px; margin-left:60px; opacity:0.6;\"><\u002Fdiv>\n          <span style=\"font-family:var(--font-mono); font-size:12px; color:var(--muted); margin-top:24px;\">FINANCIAL ANALYTICS DASHBOARD<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:44px; display:flex; flex-direction:column; gap:18px; justify-content:center;\">\n        <span style=\"font-family:var(--font-mono); font-size:12px; color:var(--accent);\">FINANCIAL SERVICES<\u002Fspan>\n        <p style=\"font-size:17px; line-height:1.55; color:var(--fg);\">CGA built a financial analytics dashboard for an international financial institution.<\u002Fp>\n        <div style=\"display:flex; flex-direction:column; gap:8px; font-size:14px; color:var(--muted);\">\n          <span>— Performance-data submission<\u002Fspan>\n          <span>— Multi-step approval workflow<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex; gap:8px; flex-wrap:wrap; margin-top:6px;\">\n          <span style=\"font-family:var(--font-mono); font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:100px; padding:5px 10px;\">Microsoft Azure<\u002Fspan>\n          <span style=\"font-family:var(--font-mono); font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:100px; padding:5px 10px;\">SQL Server<\u002Fspan>\n          <span style=\"font-family:var(--font-mono); font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:100px; padding:5px 10px;\">Angular JS<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex; align-items:center; gap:12px; font-size:14px; color:var(--muted);\">\n      <span>Also delivered in:<\u002Fspan>\n      <span style=\"font-family:var(--font-mono); border:1px solid var(--line); border-radius:100px; padding:6px 14px; font-size:12px;\">Health Care<\u002Fspan>\n      <span style=\"font-family:var(--font-mono); border:1px solid var(--line); border-radius:100px; padding:6px 14px; font-size:12px;\">Ed-Tech<\u002Fspan>\n      <span style=\"font-family:var(--font-mono); border:1px solid var(--line); border-radius:100px; padding:6px 14px; font-size:12px;\">Government<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"about\" data-screen-label=\"About\" style=\"background:var(--bg2); padding:110px 48px; display:grid; grid-template-columns:minmax(240px,0.8fr) minmax(320px,1.2fr); gap:56px;\">\n    <div style=\"display:flex; flex-direction:column; gap:16px;\">\n      <span style=\"font-family:var(--font-mono); font-size:12px; letter-spacing:0.1em; color:var(--accent);\">ABOUT CGA<\u002Fspan>\n      <h2 style=\"font-family:var(--font-display); font-weight:600; font-size:clamp(1.8rem, 3vw, 2.6rem); letter-spacing:-0.01em; max-width:14ch;\">A partner built for demanding needs.<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex; flex-direction:column; gap:24px;\">\n      <p style=\"font-size:16px; line-height:1.6; color:var(--fg);\">CG Advisors LLC is a consulting firm based in Washington, DC, specializing in product strategy, business transformation, and technology solutions — delivered with white-glove attention to detail.<\u002Fp>\n      <p style=\"font-size:16px; line-height:1.6; color:var(--muted);\">Our leadership brings over 25 years of experience planning and driving mission-critical digital transformation for clients in financial services, health care, ed-tech, and government.<\u002Fp>\n      <p style=\"font-family:var(--font-display); font-weight:600; font-size:clamp(1.3rem, 2vw, 1.7rem); color:var(--accent); margin-top:8px;\">“We only succeed when our clients succeed.”<\u002Fp>\n      <a href=\"#contact\" style=\"align-self:flex-start; font-size:14px; font-weight:600; border:1px solid var(--line); color:var(--fg); padding:13px 24px; border-radius:100px; margin-top:8px;\" style-hover=\"border-color:var(--accent); color:var(--accent);\">Contact us<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"contact\" data-screen-label=\"Contact\" style=\"background:var(--bg); padding:110px 48px; display:flex; flex-direction:column; align-items:center; gap:40px;\">\n    <div style=\"display:flex; flex-direction:column; gap:16px; max-width:560px; text-align:center; align-items:center;\">\n      <span style=\"font-family:var(--font-mono); font-size:12px; letter-spacing:0.1em; color:var(--accent);\">CONTACT<\u002Fspan>\n      <h2 style=\"font-family:var(--font-display); font-weight:600; font-size:clamp(1.8rem, 3vw, 2.6rem); letter-spacing:-0.01em;\">Let's build what's next.<\u002Fh2>\n      <p style=\"color:var(--muted); font-size:16px;\">Tell us what you're working on — we'll follow up shortly.<\u002Fp>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ submitted }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"border:1px solid var(--line); border-radius:18px; padding:48px; text-align:center; max-width:480px; display:flex; flex-direction:column; gap:8px;\">\n        <span style=\"font-family:var(--font-display); font-weight:600; font-size:1.3rem; color:var(--accent);\">Thanks for reaching out.<\u002Fspan>\n        <span style=\"color:var(--muted); font-size:15px;\">We'll be in touch shortly.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ notSubmitted }}\" hint-placeholder-val=\"{{ true }}\">\n      <form sc-camel-on-submit=\"{{ handleSubmit }}\" style=\"width:100%; max-width:640px; display:flex; flex-direction:column; gap:18px;\">\n        <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:18px;\">\n          <input name=\"firstName\" placeholder=\"First name\" value=\"{{ form.firstName }}\" sc-camel-on-change=\"{{ handleChange }}\" style=\"background:var(--bg2); border:1px solid var(--line); color:var(--fg); padding:14px 16px; border-radius:10px; font-size:15px; font-family:var(--font-body);\">\n          <input name=\"lastName\" placeholder=\"Last name\" value=\"{{ form.lastName }}\" sc-camel-on-change=\"{{ handleChange }}\" style=\"background:var(--bg2); border:1px solid var(--line); color:var(--fg); padding:14px 16px; border-radius:10px; font-size:15px; font-family:var(--font-body);\">\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:18px;\">\n          <input name=\"company\" placeholder=\"Company\" value=\"{{ form.company }}\" sc-camel-on-change=\"{{ handleChange }}\" style=\"background:var(--bg2); border:1px solid var(--line); color:var(--fg); padding:14px 16px; border-radius:10px; font-size:15px; font-family:var(--font-body);\">\n          <input name=\"title\" placeholder=\"Title\" value=\"{{ form.title }}\" sc-camel-on-change=\"{{ handleChange }}\" style=\"background:var(--bg2); border:1px solid var(--line); color:var(--fg); padding:14px 16px; border-radius:10px; font-size:15px; font-family:var(--font-body);\">\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:18px;\">\n          <input name=\"email\" type=\"email\" placeholder=\"Email\" value=\"{{ form.email }}\" sc-camel-on-change=\"{{ handleChange }}\" style=\"background:var(--bg2); border:1px solid var(--line); color:var(--fg); padding:14px 16px; border-radius:10px; font-size:15px; font-family:var(--font-body);\">\n          <input name=\"phone\" placeholder=\"Phone\" value=\"{{ form.phone }}\" sc-camel-on-change=\"{{ handleChange }}\" style=\"background:var(--bg2); border:1px solid var(--line); color:var(--fg); padding:14px 16px; border-radius:10px; font-size:15px; font-family:var(--font-body);\">\n        <\u002Fdiv>\n        <textarea name=\"lookingFor\" placeholder=\"What are you looking for?\" value=\"{{ form.lookingFor }}\" sc-camel-on-change=\"{{ handleChange }}\" rows=\"4\" style=\"background:var(--bg2); border:1px solid var(--line); color:var(--fg); padding:14px 16px; border-radius:10px; font-size:15px; font-family:var(--font-body); resize:vertical;\"><\u002Ftextarea>\n        <button type=\"submit\" style=\"align-self:center; font-size:15px; font-weight:600; background:var(--accent); color:var(--accent-ink); padding:15px 36px; border-radius:100px; border:none; cursor:pointer; font-family:var(--font-body); margin-top:8px;\" style-hover=\"filter:brightness(1.08);\">Submit<\u002Fbutton>\n      <\u002Fform>\n    <\u002Fsc-if>\n  <\u002Fsection>\n\n  <footer style=\"border-top:1px solid var(--line); padding:40px 48px; display:flex; flex-direction:column; gap:28px;\">\n    <div style=\"display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:24px;\">\n      <div style=\"display:flex; align-items:center; gap:12px;\">\n        <image-slot id=\"cga-footer-logo\" shape=\"rounded\" radius=\"8\" placeholder=\"Mark\" style=\"width:32px; height:32px; flex:none;\" src=\"7f066b08-1d2b-4ba9-9f0a-ceb72fba693a\"><\u002Fimage-slot>\n        <span style=\"font-family:var(--font-display); font-weight:700; font-size:15px;\">CG Advisors<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex; gap:28px; flex-wrap:wrap;\">\n        <a href=\"#services\" style=\"font-size:13px; color:var(--muted);\" style-hover=\"color:var(--fg);\">Services<\u002Fa>\n        <a href=\"#work\" style=\"font-size:13px; color:var(--muted);\" style-hover=\"color:var(--fg);\">Work<\u002Fa>\n        <a href=\"#about\" style=\"font-size:13px; color:var(--muted);\" style-hover=\"color:var(--fg);\">About<\u002Fa>\n        <a href=\"#contact\" style=\"font-size:13px; color:var(--muted);\" style-hover=\"color:var(--fg);\">Contact<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; font-size:12px; color:var(--muted);\">\n      <span>© {{ currentYear }} CG Advisors LLC<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;theme&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;dark&quot;, &quot;options&quot;: [&quot;dark&quot;, &quot;light&quot;], &quot;tsType&quot;: &quot;'dark'|'light'&quot;},\n  &quot;agenticMode&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;},\n  &quot;showTicker&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;}\n}\">\nclass Component extends DCLogic {\n  state = {\n    form: { firstName: '', lastName: '', company: '', title: '', email: '', phone: '', lookingFor: '' },\n    submitted: false\n  };\n\n  handleChange = (e) => {\n    const { name, value } = e.target;\n    this.setState(s => ({ form: { ...s.form, [name]: value } }));\n  };\n\n  handleSubmit = (e) => {\n    e.preventDefault();\n    this.setState({ submitted: true });\n  };\n\n  renderVals() {\n    const theme = this.props.theme ?? 'dark';\n    const agentic = this.props.agenticMode ?? true;\n    const dark = theme !== 'light';\n\n    const vars = dark ? {\n      '--bg': 'oklch(0.15 0.012 258)',\n      '--bg2': 'oklch(0.205 0.014 258)',\n      '--fg': 'oklch(0.97 0.004 258)',\n      '--muted': 'oklch(0.68 0.02 258)',\n      '--line': 'oklch(0.4 0.02 258 / 0.5)'\n    } : {\n      '--bg': 'oklch(0.98 0.006 258)',\n      '--bg2': 'oklch(0.94 0.008 258)',\n      '--fg': 'oklch(0.2 0.012 258)',\n      '--muted': 'oklch(0.45 0.02 258)',\n      '--line': 'oklch(0.6 0.02 258 / 0.4)'\n    };\n\n    return {\n      rootStyle: {\n        ...vars,\n        '--accent': 'oklch(0.8 0.19 148)',\n        '--accent2': 'oklch(0.78 0.19 300)',\n        '--accent-ink': 'oklch(0.18 0.02 148)',\n        '--font-display': \"'Space Grotesk', sans-serif\",\n        '--font-body': \"'Public Sans', sans-serif\",\n        '--font-mono': \"'Space Grotesk', monospace\",\n        background: 'var(--bg)',\n        color: 'var(--fg)',\n        fontFamily: 'var(--font-body)',\n        minHeight: '100vh'\n      },\n      heroSubhead: agentic\n        ? \"We partner with founders and executives to turn ambitious ideas into working software \\u2014 and the agentic systems that run it around the clock.\"\n        : \"We partner with founders and executives to turn ambitious ideas into working software, backed by two decades of hands-on delivery experience.\",\n      techDesc: agentic\n        ? \"Software, AI, and agentic systems \\u2014 designed, built, and hosted to run without you watching.\"\n        : \"Software design, development, and hosting \\u2014 built to automate, track, and monitor your business in real time.\",\n      techBullet: agentic\n        ? \"AI agents, automation pipelines & predictive models\"\n        : \"Mobile apps, business dashboards & databases\",\n      tickerText: 'Currently engineering agentic workflows across finance, health, and government',\n      showTicker: this.props.showTicker ?? true,\n      form: this.state.form,\n      handleChange: this.handleChange,\n      handleSubmit: this.handleSubmit,\n      submitted: this.state.submitted,\n      notSubmitted: !this.state.submitted,\n      currentYear: new Date().getFullYear()\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
